[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copista-evidence"
version = "1.1.0"
description = "copista-evidence: KobiMusic's optical music recognition reader with a learned evidence model, page images of printed music to MusicXML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
    "opencv-python",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
